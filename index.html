<head>

<body>
  <div id="app">
    <style>
      html,
      body,
      #app {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .index-loader {
        height: 4px;
        width: 130px;
        --c: no-repeat linear-gradient(#409EFF 0, #409EFF 0);
        background: no-repeat linear-gradient(#409EFF 0, #409EFF 0), no-repeat linear-gradient(#409EFF 0, #409EFF 0), #c6e2ff;
        background: no-repeat linear-gradient(#409EFF 0 0), no-repeat linear-gradient(#409EFF 0 0), #c6e2ff;
        background: var(--c), var(--c), #c6e2ff;
        background-size: 60% 100%;
        animation: l16 3s infinite;
      }

      @supports (background: linear-gradient(red 0%, red 0% 1%, red 2%)) {
.index-loader {
        --c: no-repeat linear-gradient(#409EFF 0 0);
      }
}

      @keyframes l16 {
        0% {
          background-position: -150% 0, -150% 0
        }

        66% {
          background-position: 250% 0, -150% 0
        }

        100% {
          background-position: 250% 0, 250% 0
        }
      }
    </style>
    <div class="index-loader"></div>
  </div>
</body>

</html>
